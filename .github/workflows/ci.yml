name: CI

on:
  push:
    # The working branch is checked as well, so what the Pages workflow publishes has passed CI.
    branches: [main, 'claude/practical-rubin-idyxdo']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pacient
          POSTGRES_PASSWORD: pacient
          POSTGRES_DB: pacient_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pacient" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pacient:pacient@localhost:5432/pacient_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pages artifact would be accepted (same check as the deploy workflow)
        run: node deploy/prepare-pages.mjs
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
