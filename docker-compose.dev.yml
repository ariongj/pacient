# Database and mail catcher for local development with `npm run dev` (the app itself runs on Node).
# Started automatically by `npm run setup` when no PostgreSQL is reachable on localhost:5432.
name: pacient-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pacient
      POSTGRES_PASSWORD: pacient
      POSTGRES_DB: pacient
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pacient -d pacient']
      interval: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
  # Optional image archive (PACS) for radiology. Uncomment, then set in apps/api/.env:
  #   PACS_MODE=dicomweb
  #   PACS_DICOMWEB_URL=http://localhost:8042/dicom-web
  #   PACS_AUTH_HEADER=Basic cGFjaWVudDpwYWNpZW50      # pacient:pacient
  # Send studies to it with any DICOM tool (AE title ORTHANC, port 4242) or upload in the
  # Orthanc web UI at http://localhost:8042. Without it the API uses built-in demo images.
  # orthanc:
  #   image: orthancteam/orthanc:24.12.0
