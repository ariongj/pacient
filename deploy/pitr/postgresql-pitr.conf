# PostgreSQL settings for continuous WAL archiving to pgBackRest. Reference copy: the image ships
# it at /etc/postgresql/pitr.conf and deploy/compose.pitr.yml passes the same values as `-c` flags
# (for a non-container installation, append these lines to postgresql.conf).
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=pacient archive-push %p'
# Close a WAL segment at least every 60 s so at most about a minute of committed work can be lost
# (recovery point objective) even when the system is quiet.
archive_timeout = 60
max_wal_senders = 3
wal_compression = on
