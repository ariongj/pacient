# HTTPS for the Pacient API with nginx. The API listens on 127.0.0.1:18840 only; this server is
# its only public entrance. Replace the host name, then for example:
#   sudo cp deploy/proxy/nginx-pacienti-api.conf /etc/nginx/conf.d/pacienti-api.conf
#   sudo certbot certonly --nginx -d pacienti-api.itdks.tech
#   sudo nginx -t && sudo systemctl reload nginx      (reload: existing sites keep running)
# If nginx -t reports "Address family not supported", the server has no IPv6: remove the
# "listen [::]:…" lines.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx 1.25.1 or newer; older: "listen 443 ssl http2;"
    server_name pacienti-api.itdks.tech;

    ssl_certificate     /etc/letsencrypt/live/pacienti-api.itdks.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pacienti-api.itdks.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Documents are up to 10 MB; the API checks the real limit.
    client_max_body_size 12m;

    # Shared by both locations below. One proxy hop: the API runs with TRUST_PROXY=1.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://127.0.0.1:18840;
        proxy_read_timeout 90s;
    }

    # Live updates (Server-Sent Events): delivered at once and kept open; the API sends a
    # keep-alive every 25 seconds.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:18840;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Metrics are for the monitoring on this host (or with METRICS_TOKEN), never public.
    location = /metrics {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pacienti-api.itdks.tech;
    return 301 https://$host$request_uri;
}
