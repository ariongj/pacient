# pgBackRest configuration for the Pacient compose deployment (stanza "pacient").
#
# Secrets are NOT stored here: the repository encryption passphrase comes from the environment
# variable PGBACKREST_REPO1_CIPHER_PASS (and PGBACKREST_REPO2_* for an off-site repository).
# Losing that passphrase makes every backup unreadable – keep it in the password manager / safe
# together with the other recovery secrets (MFA_ENCRYPTION_KEY, backup age identity).

[global]
# Repository 1: a dedicated volume on the database host (fast restores).
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Keep two full backups (weekly full + daily differential => 7–14 days of point-in-time recovery).
repo1-retention-full=2
repo1-retention-full-type=count

# Repository 2 (recommended): off-site, S3-compatible object storage. Uncomment and set the
# PGBACKREST_REPO2_S3_KEY / PGBACKREST_REPO2_S3_KEY_SECRET / PGBACKREST_REPO2_CIPHER_PASS
# environment variables. The db container then needs outbound network access to the endpoint.
# repo2-type=s3
# repo2-path=/pacient
# repo2-s3-bucket=pacient-backups
# repo2-s3-endpoint=s3.example.eu
# repo2-s3-region=eu-central-1
# repo2-s3-uri-style=path
# repo2-cipher-type=aes-256-cbc
# repo2-retention-full=4

compress-type=zst
compress-level=3
process-max=2
start-fast=y
delta=y

# Asynchronous archiving: WAL segments are queued in the spool and pushed in batches, so a slow
# repository never blocks commits. archive-push-queue-max protects the disk: if the repository is
# unreachable for long, WAL is dropped from the queue (PITR gap, alerted by `pitr.sh check`)
# instead of filling the database disk and stopping the hospital system.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[pacient]
pg1-path=/var/lib/postgresql/data
pg1-user=pacient
pg1-database=pacient
