name: Pacient frontend
on:
  workflow_dispatch:
  push:
    branches: ['claude/practical-rubin-idyxdo']
    paths:
      ['apps/web/**', 'package*.json', 'deploy/prepare-pages.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pacient-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PACIENTI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment settings
        env:
          VITE_API_BASE_URL: ${{ vars.PACIENTI_API_BASE_URL }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PACIENTI_WEB_DOMAIN }}
        run: |
          node --input-type=module -e "const u=new URL(process.env.VITE_API_BASE_URL); if(u.protocol!=='https:' || u.pathname!=='/api/v1' || u.username || u.password) throw Error('An HTTPS API URL ending in /api/v1 is required'); if(!process.env.PAGES_CUSTOM_DOMAIN) throw Error('A same-site custom frontend domain is required for secure session cookies');"
      - run: npm ci
      - name: Build frontend only
        run: npm run build -w @pacient/web
        env:
          VITE_API_BASE_URL: ${{ vars.PACIENTI_API_BASE_URL }}
          WEB_BASE_PATH: /
      - name: Verify public artifact
        run: node deploy/prepare-pages.mjs
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PACIENTI_WEB_DOMAIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
